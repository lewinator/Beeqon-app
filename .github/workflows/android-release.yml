name: Android release

# Started from Beeqon → Settings → App Releases → "Publish update".
# Builds the signed app bundle, uploads it to Google Play, then tags the exact
# source (android-vX.Y.Z) and keeps the bundle on a GitHub Release.
#
# Repository secrets (Settings → Secrets and variables → Actions):
#   KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD,
#   PLAY_SERVICE_ACCOUNT_JSON

run-name: "Android release ${{ inputs.version_name }} [${{ inputs.release_id }}]"

on:
  workflow_dispatch:
    inputs:
      release_id:
        description: Beeqon release record id (leave blank for a manual build)
        required: false
        default: ""
      version_name:
        description: Version shown to users, e.g. 1.0.1
        required: true
        default: "1.0.0"
      version_code:
        description: Play version code (whole number, always increasing)
        required: false
        default: ""
      track:
        description: Play track (internal, alpha, production)
        required: true
        default: internal
      notes:
        description: What changed
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: android-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Refuse a version that was already published
        run: |
          if git rev-parse -q --verify "refs/tags/android-v${{ inputs.version_name }}" >/dev/null; then
            echo "::error::Version ${{ inputs.version_name }} has already been published."
            exit 1
          fi

      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21", cache: gradle }
      - run: bun install
      - run: bunx cap sync android

      - name: Restore upload key
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then echo "::error::KEYSTORE_BASE64 is not set"; exit 1; fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"

      - name: Build signed bundle
        working-directory: android
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/upload.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          VERSION_CODE: ${{ inputs.version_code != '' && inputs.version_code || github.run_number }}
          VERSION_NAME: ${{ inputs.version_name }}
        run: |
          chmod +x gradlew
          ./gradlew bundleRelease
          cp app/build/outputs/bundle/release/app-release.aab "$RUNNER_TEMP/beeqon-${{ inputs.version_name }}.aab"

      - uses: actions/upload-artifact@v4
        with:
          name: beeqon-release-aab
          path: ${{ runner.temp }}/beeqon-${{ inputs.version_name }}.aab

      - name: Write release notes
        env:
          NOTES: ${{ inputs.notes }}
        run: |
          mkdir -p "$RUNNER_TEMP/whatsnew"
          [ -z "$NOTES" ] && NOTES="Improvements to Beeqon."
          printf '%s' "${NOTES:0:490}" > "$RUNNER_TEMP/whatsnew/whatsnew-en-GB"

      - name: Upload to Google Play
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: za.co.beeqon.app
          releaseFiles: ${{ runner.temp }}/beeqon-${{ inputs.version_name }}.aab
          track: ${{ inputs.track }}
          status: completed
          releaseName: ${{ inputs.version_name }}
          whatsNewDirectory: ${{ runner.temp }}/whatsnew

      - name: Tag source and keep the bundle
        env:
          GH_TOKEN: ${{ github.token }}
          NOTES: ${{ inputs.notes }}
        run: |
          TAG="android-v${{ inputs.version_name }}"
          git tag "$TAG" "$GITHUB_SHA"
          git push origin "$TAG"
          gh release create "$TAG" "$RUNNER_TEMP/beeqon-${{ inputs.version_name }}.aab" \
            --title "Beeqon ${{ inputs.version_name }}" --notes "${NOTES:-Android release}"

      - name: Remove upload key
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.jks"
