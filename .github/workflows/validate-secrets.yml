name: Validate release secrets

# Manual check: decodes each signing secret and reports PASS/FAIL only.
# Never prints secret values.

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - name: Check APPLE_DISTRIBUTION_P12
        env:
          P12_B64: ${{ secrets.APPLE_DISTRIBUTION_P12 }}
          P12_PASS: ${{ secrets.APPLE_P12_PASSWORD }}
        run: |
          if [ -z "$P12_B64" ]; then echo "P12: FAIL (empty)"; exit 1; fi
          if ! echo "$P12_B64" | base64 --decode > /tmp/cert.p12 2>/dev/null; then echo "P12: FAIL (not valid base64)"; exit 1; fi
          if openssl pkcs12 -info -in /tmp/cert.p12 -nokeys -passin "pass:$P12_PASS" >/dev/null 2>&1; then
            echo "P12: PASS"
          else
            echo "P12: FAIL (decoded but certificate unreadable - password may be wrong)"
            exit 1
          fi
          rm -vf /tmp/cert.p12

      - name: Check IOS_PROVISION_PROFILE_BASE64
        env:
          PROFILE_B64: ${{ secrets.IOS_PROVISION_PROFILE_BASE64 }}
        run: |
          if [ -z "$PROFILE_B64" ]; then echo "PROFILE: FAIL (empty)"; exit 1; fi
          if ! echo "$PROFILE_B64" | base64 --decode > /tmp/profile.mobileprovision 2>/dev/null; then echo "PROFILE: FAIL (not valid base64)"; exit 1; fi
          if security cms -D -i /tmp/profile.mobileprovision >/dev/null 2>&1; then
            echo "PROFILE: PASS"
          else
            echo "PROFILE: FAIL (decoded but not a valid provisioning profile)"
            exit 1
          fi
          rm -vf /tmp/profile.mobileprovision

      - name: Check ASC_KEY_P8_BASE64
        env:
          P8_B64: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: |
          if [ -z "$P8_B64" ]; then echo "P8: FAIL (empty)"; exit 1; fi
          if ! echo "$P8_B64" | base64 --decode > /tmp/key.p8 2>/dev/null; then echo "P8: FAIL (not valid base64)"; exit 1; fi
          if grep -q "BEGIN PRIVATE KEY" /tmp/key.p8; then
            echo "P8: PASS"
          else
            echo "P8: FAIL (decoded but missing PRIVATE KEY marker)"
            exit 1
          fi
          rm -vf /tmp/key.p8

      - name: Check ASC identifiers
        env:
          KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          if [ -z "$KEY_ID" ]; then echo "ASC_KEY_ID: FAIL (empty)"; exit 1; fi
          if [ -z "$ISSUER_ID" ]; then echo "ASC_ISSUER_ID: FAIL (empty)"; exit 1; fi
          echo "ASC identifiers: PASS (both set)"

      - name: Summary
        if: always()
        run: echo "Check complete - see PASS/FAIL lines above."
